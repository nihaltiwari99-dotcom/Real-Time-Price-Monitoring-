<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-time Price Monitoring System</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-image: url('static/406.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            position: relative;
            color: white;

        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            padding-top: 80px;
        }

        .title-box {
            margin-left: 15%;
            margin-bottom: 140px;
            padding: 25px 40px;
            border: 2px solid white;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0px 0px 15px rgba(0,0,0,0.7);
        }

        .title {
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
            line-height: 1.3;
        }

        select {
            margin-left:15%
            width: 50px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid gray;
            font-size: 15px;
            margin-top: 20px;
        }

        .check-btn {

            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        .check-btn:hover {
            background-color: darkgreen;
        }

        .result-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: flex-start;
        }

        #result-box, #description-box {
            left:50px:
            width: 520px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 18px;
            text-align: left;
        }

        .author {
            position: fixed;
            top: 5px;

            color: black;
            font-size: 15px;
            opacity: 0.9;

            padding: 8px 15px;

        }
        #image-box{
        width: 300px;
        padding: 15px;
        border-radius: 10px;
        background: rgba(0,0,0,0.6);
        }
    </style>

</head>

<body>

<div class="container">

    <div class="title-box">

        <div class="title">
            Real-time Price Monitoring System and Alert System
        </div>

        <br>

        <form action="/check_price" method="GET">
            <select id="product" name="product">
                <option value="Fjallraven - Foldsack No. 1 Backpack, Fits 15 Laptops">Fjallraven - Foldsack No. 1 Backpack, Fits 15 Laptops</option>
                <option value="Mens Casual Premium Slim Fit T-Shirts ">Mens Casual Premium Slim Fit T-Shirts </option>
                <option value="Mens Cotton Jacket">Mens Cotton Jacket</option>
                <option value="Mens Casual Slim Fit">Mens Casual Slim Fit</option>
                <option value="John Hardy Women's Legends Naga Gold & Silver Dragon Station Chain Bracelet">John Hardy Women's Legends Naga Gold & Silver Dragon Station Chain Bracelet</option>
                <option value="Solid Gold Petite Micropave ">Solid Gold Petite Micropave </option>
                <option value="White Gold Plated Princess">White Gold Plated Princess</option>
                <option value="Pierced Owl Rose Gold Plated Stainless Steel Double">Pierced Owl Rose Gold Plated Stainless Steel Double</option>
                <option value="WD 2TB Elements Portable External Hard Drive - USB 3.0 ">WD 2TB Elements Portable External Hard Drive - USB 3.0 </option>
                <option value="SanDisk SSD PLUS 1TB Internal SSD - SATA III 6 Gb/s">SanDisk SSD PLUS 1TB Internal SSD - SATA III 6 Gb/s</option>
                <option value="Silicon Power 256GB SSD 3D NAND A55 SLC Cache Performance Boost SATA III 2.5">Silicon Power 256GB SSD 3D NAND A55 SLC Cache Performance Boost SATA III 2.5</option>
                <option value="WD 4TB Gaming Drive Works with Playstation 4 Portable External Hard Drive">WD 4TB Gaming Drive Works with Playstation 4 Portable External Hard Drive</option>
                <option value="Acer SB220Q bi 21.5 inches Full HD (1920 x 1080) IPS Ultra-Thin">Acer SB220Q bi 21.5 inches Full HD (1920 x 1080) IPS Ultra-Thin</option>
                <option value="Samsung 49-Inch CHG90 144Hz Curved Gaming Monitor (LC49HG90DMNXZA) – Super Ultrawide Screen QLED ">Samsung 49-Inch CHG90 144Hz Curved Gaming Monitor (LC49HG90DMNXZA) – Super Ultrawide Screen QLED </option>
                <option value="BIYLACLESEN Women's 3-in-1 Snowboard Jacket Winter Coats">BIYLACLESEN Women's 3-in-1 Snowboard Jacket Winter Coats</option>
                <option value="Lock and Love Women's Removable Hooded Faux Leather Moto Biker Jacket">Lock and Love Women's Removable Hooded Faux Leather Moto Biker Jacket</option>
                <option value="Rain Jacket Women Windbreaker Striped Climbing Raincoats">Rain Jacket Women Windbreaker Striped Climbing Raincoats</option>
                <option value="MBJ Women's Solid Short Sleeve Boat Neck V ">MBJ Women's Solid Short Sleeve Boat Neck V </option>
                <option value="Opna Women's Short Sleeve Moisture">Opna Women's Short Sleeve Moisture</option>
                <option value="DANVOUY Womens T Shirt Casual Cotton Short">DANVOUY Womens T Shirt Casual Cotton Short</option>
            </select>
            <button class="check-btn" type="submit">Check</button>
        </form>

        <div class="result-container">

            <div id="result-box">
                <h2>Price Monitoring Result</h2>
                <p><b>Product:</b> {{ product }}</p>
                <p><b>Old Price:</b> ${{ old_price }}</p>
                <p><b>Latest Price:</b> ${{ latest_price }}</p>
                <p><b>Alert:</b> {{ alert }}</p>

                <div id="description-box">
                  <h2>Product Description</h2>
                    <p>{{ description }}</p>
                </div>
            </div>


                <div id="image-box">
                    <h2>Product Image</h2>
                    <img src="{{ image }}" width="250">
                </div>


        </div>

    </div>

</div>

<h3 class="author">A Project By Nihal Tiwari</h3>

</body>
</html>
